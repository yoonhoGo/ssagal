# v* 태그 푸시 시: 테스트 → 바이너리 빌드 → npm publish → GitHub Release 생성.
# npm 인증은 access token 사용 — 저장소 시크릿 NPM_TOKEN 에 등록 필요
# (npmjs.com → Access Tokens → Automation 토큰 생성 후 repo Settings > Secrets 에 추가).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub Release 생성

jobs:
  release:
    # macOS arm64 전용 패키지이므로 Apple Silicon 러너 사용
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 태그와 package.json 버전 일치 검증
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "태그($TAG_VERSION)와 package.json($PKG_VERSION) 버전이 다릅니다." >&2
            exit 1
          fi

      - run: npm test

      # prepublishOnly가 cargo release 빌드 + dist-bin 패키징을 수행
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ssagal-*.tgz
