<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쌰갈</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="stage" data-tauri-drag-region>
      <img class="fire-overlay" id="fire-overlay" src="/assets/fire-ssyagal.png" alt="" />
      <button class="bubble" id="ssyagal-btn" aria-label="쌰갈">
        <span class="bubble__text">쌰갈!</span>
      </button>
      <div class="controls">
        <button class="pill" data-times="3">x3</button>
        <button class="pill" data-times="5">x5</button>
        <button class="pill" data-times="10">x10</button>
        <button class="pill pill--stop" id="stop-btn">■ 중지</button>
      </div>
      <div class="progress" id="progress"></div>
    </div>
  </body>
</html>
